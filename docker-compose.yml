services:
  # ===========================================================================
  # Data stores
  # ===========================================================================

  # 1. Telemetry & Metadata DB (TimescaleDB / Postgres) — cold path
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: mater_timescaledb
    environment:
      - POSTGRES_USER=mater_admin
      - POSTGRES_PASSWORD=mater_secure_password
      - POSTGRES_DB=mater_fleet
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mater_admin -d mater_fleet"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # 2. RAG & Diagnosis Vector DB (Qdrant) — knowledge path
  qdrant:
    image: qdrant/qdrant:latest
    container_name: mater_qdrant
    ports:
      - "6333:6333" # HTTP API
      - "6334:6334" # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # 3. Hot-Path Live Telemetry Cache (Redis)
  redis:
    image: redis:alpine
    container_name: mater_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # 4. LLM Engine (Ollama) — runs Mater + Host
  ollama:
    image: ollama/ollama:latest
    container_name: mater_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  # ===========================================================================
  # Application services (single backend image, multiple entrypoints)
  # ===========================================================================

  # Ingestion API (/live-car-data) + write-behind flusher
  ingestion:
    build: ./backend
    container_name: mater_ingestion
    command: uvicorn ingestion.app:app --host 0.0.0.0 --port 8000
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PG_DSN=postgresql://mater_admin:mater_secure_password@timescaledb:5432/mater_fleet
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  # Fast-MCP tool server (13 tools)
  mcp:
    build: ./backend
    container_name: mater_mcp
    command: python -m mcp_server.server
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PG_DSN=postgresql://mater_admin:mater_secure_password@timescaledb:5432/mater_fleet
      - QDRANT_URL=http://qdrant:6333
      - MCP_PORT=8765
    ports:
      - "8765:8765"
    depends_on:
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

  # Agent gateway (chat + dashboard read-throughs)
  agent:
    build: ./backend
    container_name: mater_agent
    command: uvicorn agent.api:app --host 0.0.0.0 --port 8100
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PG_DSN=postgresql://mater_admin:mater_secure_password@timescaledb:5432/mater_fleet
      - QDRANT_URL=http://qdrant:6333
      - MCP_URL=http://mcp:8765/mcp
      - OLLAMA_URL=http://ollama:11434
      - LLM_MODEL=gemma4:e4b-mini
    ports:
      - "8100:8100"
    depends_on:
      - mcp
      - ollama
    restart: unless-stopped

  # Next.js dashboard + chat UI
  frontend:
    build: ./frontend
    container_name: mater_frontend
    environment:
      - NEXT_PUBLIC_AGENT_URL=http://localhost:8100
    ports:
      - "3000:3000"
    depends_on:
      - agent
    restart: unless-stopped

volumes:
  timescale_data:
  qdrant_data:
  redis_data:
  ollama_data:
