[project]
name = "mater-backend"
version = "0.1.0"
description = "Mater backend: ingestion, Fast-MCP tools, and LangGraph agents"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["common", "ingestion", "mcp_server", "agent", "tools"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
